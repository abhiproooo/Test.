name: Build Godot C++ Extension

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install SCons
      run: pip install scons

    - name: Setup Android NDK
      run: |
        wget https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
        unzip android-ndk-r26b-linux.zip
        mkdir -p $GITHUB_WORKSPACE/android-sdk/ndk
        mv android-ndk-r26b $GITHUB_WORKSPACE/android-sdk/ndk/28.1.13356709
        echo "ANDROID_HOME=$GITHUB_WORKSPACE/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/android-sdk" >> $GITHUB_ENV

    - name: Clone Godot C++
      run: |
        git clone https://github.com/godotengine/godot-cpp.git
        cd godot-cpp
        git submodule update --init --recursive

    - name: Compile with SCons
      run: |
        # First, build the godot-cpp static library
        cd godot-cpp
        scons platform=android target=template_debug arch=arm64 use_llvm=yes api_version=4.7 generate_bindings=yes
        cd ..
        
        # Next, compile YOUR code using the static library we just built
        scons platform=android target=template_debug arch=arm64 use_llvm=yes api_version=4.7

    - name: Upload Compiled Library
      uses: actions/upload-artifact@v4
      with:
        name: android-libs
        path: '**/*.so'
